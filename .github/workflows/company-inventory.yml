name: Build complete Shopizer company inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_company_inventory.py'
      - 'docs/code-company-explorer/companies.json'
      - '.github/workflows/company-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinned-company-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout learning repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout fixed reference Shopizer source
        uses: actions/checkout@v4
        with:
          repository: shopizer-ecommerce/shopizer
          ref: 6a4a0a65a3408ee8f62597b51d1b3aac24b77dee
          path: .shopizer-pinned
          persist-credentials: false
      - name: Prepare Python and pinned Java parser
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-java==0.23.5
      - name: Generate numbered inventory and batch status checklist
        run: python scripts/build_company_inventory.py
      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/code-company-explorer/company-inventory.json docs/code-company-explorer/BATCH-CHECKLIST.md
          if ! git diff --cached --quiet; then
            git commit -m "data(explorer): inventory every pinned Shopizer Java method and batch"
            git push origin HEAD:main
          fi
