  <aside class="side" id="sidebar" aria-label="Repository folders and companies">
    <div class="side-header"><div class="brandmark">C<span style="color:var(--orange)">/</span>C</div><div><div class="brandname">CODE COMPANY</div><div class="brand-sub">REPOSITORY EXPLORER</div></div><button class="side-close" id="side-close" type="button" aria-label="Close folder menu" title="Close folder menu"><span class="ic" data-icon="close"></span></button></div>
    <div class="side-body">
      <div class="section-label">GitHub repository</div>
      <div class="repo-card"><div class="repo-title"><span class="ic" style="color:var(--blue)" data-icon="git"></span><span>shopizer</span></div><div class="repo-meta"><span class="demo-dot"></span>Real Shopizer · loading companies</div></div>
      <div class="section-label">Folders · Files · Companies</div>
      <nav id="tree" class="tree-scroll" aria-label="Project file tree"><div class="section-label">Loading source folders…</div></nav>
    </div>
    <div class="side-bottom"><span>JAVA · SPRING BOOT</span><b>SHOPIZER</b></div>
  </aside>
  <div class="main">
    <div class="topbar"><div class="top-left"><button id="menu" class="mobile-menu" title="Open file tree" aria-label="Open file tree" aria-expanded="false"><span class="ic" data-icon="menu"></span></button><div class="breadcrumbs" id="breadcrumbs"></div></div><div class="top-actions"><div class="searchwrap"><div class="searchbox"><span class="ic" data-icon="search"></span><input id="search" placeholder="Company # or method…" type="search" autocomplete="off" aria-label="Search files and companies"></div><div class="search-results" id="search-results" hidden></div></div><button class="circle-btn" id="copy" title="Copy file and line numbers"><span class="ic" data-icon="copy"></span><span class="btn-text">Copy location</span></button></div></div>
    <nav class="company-sequence" aria-label="Browse company numbers">
      <button id="prev-company" class="sequence-button" type="button" aria-label="Previous company" title="Previous company · Left arrow" disabled><span class="ic" data-icon="back"></span><span>Previous</span></button>
      <div id="sequence-position" class="sequence-position" aria-live="polite">Loading companies…</div>
      <button id="next-company" class="sequence-button" type="button" aria-label="Next company" title="Next company · Right arrow" disabled><span>Next</span><span class="ic" data-icon="arrow"></span></button>
    </nav>
    <main class="content" id="maincontent"><div class="panel" style="padding:24px;color:var(--dim)">Loading verified Java code…</div></main>
  </div>
</div>
<script>
'use strict';
const ICONS={
 git:'<path d="M3 3v12a6 6 0 0 0 6 6h12"/><path d="M7 7h10v10H7z"/><circle cx="7" cy="7" r="1"/><circle cx="17" cy="17" r="1"/>',
 folder:'<path d="M3 19V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
 folderOpen:'<path d="M3 7V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2"/><path d="M3 20l3-9h15l-3 9z"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13l-2 2 2 2m6-4 2 2-2 2"/>',
 code:'<path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-13-2 18"/>',
 building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h2m4 0h2M8 11h2m4 0h2M8 15h2m4 0h2M10 22v-4h4v4"/>',
 branch:'<path d="M6 3v12a4 4 0 0 0 4 4h8"/><circle cx="6" cy="3" r="2"/><circle cx="18" cy="19" r="2"/><circle cx="6" cy="11" r="2"/>',
 chevron:'<path d="m9 18 6-6-6-6"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 search:'<circle cx="10" cy="10" r="7"/><path d="m15.5 15.5 6 6"/>',
 copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 close:'<path d="m5 5 14 14M19 5 5 19"/>',
 arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
 layers:'<path d="m12 2 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',
 back:'<path d="m14 18-6-6 6-6"/>',
 mark:'<path d="M4 12l5 5L20 6"/>'};
function icon(id){return `<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]||ICONS.code}</svg></span>`;}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const files={},entities={},folderData={name:'shopizer',children:[]};
async function loadRealCode(){
  const manifest=await fetch('./companies.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Cannot load companies.json');return r.json()});
  const sourcePaths=[...new Set(manifest.companies.map(c=>c.source_data_file))];
  const sources=Object.fromEntries(await Promise.all(sourcePaths.map(async p=>[p,await fetch('./'+p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Cannot load '+p);return r.json()})])));
  folderData.children=['sm-core-model','sm-core-modules','sm-core','sm-shop-model','sm-shop'].map(name=>({name,children:[]}));
  const seen=new Map();
  for(const c of manifest.companies){
    const p=c.source_path;
    if(!seen.has(p)){
      const source=sources[c.source_data_file];
      if(!source||source.source_path!==p)throw Error('Wrong file: '+p);
      const id='file-'+(seen.size+1),name=p.split('/').at(-1);
      files[id]={name,path:p,about:'Shopizer Java source · '+source.lines.length+' lines',companyIds:[],source:source.lines};
      seen.set(p,id);
      let parent=folderData;
      for(const part of p.split('/').slice(0,-1)){let next=parent.children.find(x=>x.name===part&&!x.file);if(!next){next={name:part,children:[]};parent.children.push(next)}parent=next}
      parent.children.push({name,file:id});
    }
    const fid=seen.get(p),eid='company-'+c.id;
    if(!files[fid].source||files[fid].source.length<c.end_line)throw Error('Wrong source line range: '+c.id);
    entities[eid]={no:c.id,file:fid,name:c.name,method:c.method,desc:c.plain_english,start:c.start_line,end:c.end_line,
      code:files[fid].source.slice(c.start_line-1,c.end_line),parent:c.parent_id?'company-'+c.parent_id:null,children:[],needs:[],
      externalClients:c.inbound||[],externalSuppliers:c.outbound||[]};
    if(!c.parent_id)files[fid].companyIds.push(eid);
  }
  for(const [id,c] of Object.entries(entities))if(c.parent&&entities[c.parent])entities[c.parent].children.push(id);
  for(const f of Object.values(files))f.companyIds.sort((x,y)=>entities[x].start-entities[y].start);
  selected='company-'+manifest.companies.at(-1).id;selectedFile=entities[selected].file;mode='company';activeLine=null;folderPath='shopizer';
  expanded.clear();expanded.add('f:shopizer');
  for(const file of Object.values(files)){let part='shopizer';for(const folder of file.path.split('/').slice(0,-1)){part+='/'+folder;expanded.add('f:'+part)}expanded.add('file:'+selectedFile)}
  document.querySelector('.repo-title span:nth-child(2)').textContent='shopizer-ecommerce / shopizer';
  document.querySelector('.repo-meta').innerHTML='<span class="demo-dot"></span> Real source · '+manifest.count+' verified companies';
  document.querySelector('.side-bottom').innerHTML='<span>JAVA · SPRING BOOT</span><b>REAL SOURCE</b>';
  renderAll();
}
// Initial tree state: the real GitHub directory hierarchy stays intact.
const expanded=new Set();
let selectedFile='',selected='',mode='company',activeLine=null,navStack=[];
const $=s=>document.querySelector(s);
function entityLineCount(c){return c.end?c.end-c.start+1:c.code?.length||0;}
function topEntity(id){let c=entities[id];while(c?.parent)c=entities[c.parent];return c;}
function getCode(id){const c=entities[id];if(!c.parent)return {lines:c.code||[],start:c.start,highlight:[]};const root=topEntity(id);return {lines:root.code||[],start:root.start,highlight:Array.from({length:c.end-c.start+1},(_,i)=>c.start+i)};}
function getNeeds(id){return entities[id].needs||[];}
function clientsOf(id){const seen=new Set(),out=[];if(entities[id].parent){out.push({id:entities[id].parent,line:entities[id].start});seen.add(entities[id].parent);}for(const [from,entity] of Object.entries(entities)){for(const dep of entity.needs||[]){if(dep.to!==id)continue;const key=from;if(!seen.has(key)){seen.add(key);out.push({id:from,line:dep.line});}}}return out;}
function renderNodeIcon(kind,opened){return icon(kind==='folder'?(opened?'folderOpen':'folder'):kind==='file'?'file':kind==='branch'?'branch':'building');}
function treeContent(){
 const rows=[];
 function addFolder(node,path,depth){const full=path?path+'/'+node.name:node.name,key='f:'+full,opened=expanded.has(key);const count=node.children?.length||0;
 rows.push(`<button class="tree-row folder" data-folder="${safe(key)}" style="padding-left:${8+Math.min(depth,5)*10}px" title="${safe(full)}" aria-expanded="${opened}"><span class="tree-chevron">${icon(opened?'down':'chevron')}</span>${renderNodeIcon('folder',opened)}<span class="tree-text">${safe(node.name)}</span>${depth===0?`<span class="mini-count">${Object.keys(files).length} files</span>`:''}</button>`);
 if(!opened)return;
 for(const child of node.children||[]){if(child.file)addFile(child.file,depth+1);else if(child.isResource)rows.push(`<div class="tree-row file" style="padding-left:${8+Math.min(depth+1,5)*10}px;opacity:.6"><span class="tree-chevron spacer"></span>${icon('file')}<span class="tree-text">${safe(child.name)}</span></div>`);else addFolder(child,full,depth+1);}
 }
 function addFile(fid,depth){const f=files[fid],key='file:'+fid,opened=expanded.has(key),act=selectedFile===fid;
 rows.push(`<button class="tree-row file ${act?'is-active':''}" data-file="${fid}" style="padding-left:${8+Math.min(depth,5)*10}px" title="${safe(f.path)}" aria-expanded="${opened}"><span class="tree-chevron">${icon(opened?'down':'chevron')}</span>${icon('file')}<span class="tree-text">${safe(f.name)}</span><span class="mini-count">${f.companyIds.length}</span></button>`);
 if(opened){for(const id of f.companyIds)addEntity(id,depth+1);}
 }
 function addEntity(id,depth){const c=entities[id],isSub=!!c.parent,opened=expanded.has('co:'+id),hasKids=!!c.children?.length;
 rows.push(`<button class="tree-row comp ${isSub?'sub':''} ${selected===id&&mode==='company'?'is-active':''}" data-company="${id}" style="padding-left:${8+Math.min(depth,5)*10}px" title="Company ${safe(c.no)} — ${safe(c.desc)}" ${hasKids?`aria-expanded="${opened}"`:''}><span class="tree-chevron ${hasKids?'':'spacer'}">${hasKids?icon(opened?'down':'chevron'):icon('chevron')}</span><span class="company-key">${renderNodeIcon(isSub?'branch':'company')}<span class="number">${safe(c.no)}</span></span><span class="tree-text">${safe(c.name)}</span></button>`);
 if(opened)for(const sub of c.children||[])addEntity(sub,depth+1);
 }
 addFolder(folderData,'',0);return rows.join('');
}
function renderTree(){const side=$('#tree');side.innerHTML=treeContent();}
function closeSidebar(){ $('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open');$('#menu').setAttribute('aria-expanded','false'); }
function openParents(id){const c=entities[id],f=files[c.file];const parts=f.path.split('/');let p='shopizer';expanded.add('f:'+p);for(const part of parts.slice(0,-1)){p+='/'+part;expanded.add('f:'+p);}expanded.add('file:'+c.file);let parent=c.parent;while(parent){expanded.add('co:'+parent);parent=entities[parent].parent;}}
function navToFile(fid,track=true){if(!files[fid])return;if(track)navStack.push([mode,selectedFile,selected]);selectedFile=fid;selected=null;mode='file';expanded.add('file:'+fid);renderAll();closeSidebar();}
function navToCompany(id,track=true){const c=entities[id];if(!c)return;if(track)navStack.push([mode,selectedFile,selected]);selectedFile=c.file;selected=id;mode='company';activeLine=c.parent?c.start:null;openParents(id);$('#search').value='';$('#search-results').hidden=true;renderAll();closeSidebar();}
function navBack(){if(!navStack.length)return;const [m,f,s]=navStack.pop();mode=m;selectedFile=f;selected=s;renderAll();}
function navToFolder(path){if(!path)return;const key='f:'+path;expanded.add(key);mode='folder';selected=null;folderPath=path;renderAll();closeSidebar();}
let folderPath='shopizer';
function collectFolder(node,full,match){if(full===match)return node;for(const ch of node.children||[]){if(ch.file||ch.isResource)continue;const res=collectFolder(ch,full+'/'+ch.name,match);if(res)return res;}return null;}
function renderBreadcrumb(){const f=files[selectedFile];const parts=(mode==='folder'?folderPath:f.path).split('/');const short=parts.slice(-3).join(' / ');$('#breadcrumbs').innerHTML=`shopizer &nbsp;/&nbsp; <strong>${safe(mode==='company'?f.name+' / '+entities[selected].no:short)}</strong>`;}
function heroFile(f){const roots=f.companyIds,all=roots.flatMap(id=>[id,...(entities[id].children||[])]);return `<div class="hero"><div><div class="eyebrow">${icon('file')} JAVA SOURCE FILE</div><h1>${safe(f.name)}</h1><p class="description">${safe(f.about)}</p><div class="small-meta"><span class="meta-chip"><b>${roots.length}</b> main companies</span><span class="meta-chip"><b>${all.length-roots.length}</b> subsidiaries</span><span class="linepath">${safe(f.path)}</span></div></div></div>`;}
function renderFileView(){const f=files[selectedFile],rootIds=f.companyIds;let items='';const all=[];
 for(const id of rootIds){all.push(id);all.push(...entities[id].children||[]);}for(const id of all){const c=entities[id],sub=!!c.parent;items+=`<button class="list-company ${sub?'subsidiary':''}" data-company="${id}"><span class="badge-number">${safe(c.no)}</span><span class="itemtext"><b>${safe(c.name)}</b><span>${safe(c.desc)}</span></span><span class="edge-icon">${icon('chevron')}</span></button>`;}
 const snippets=`<div class="code-divider">FULL JAVA SOURCE · ${f.source.length} LINES</div>${renderCodeRows(f.source,1,[])}`;
 return `${heroFile(f)}<div class="stats"><div class="stat blue"><b>${rootIds.length}</b><label>Main companies</label></div><div class="stat orange"><b>${all.length-rootIds.length}</b><label>Subsidiaries</label></div><div class="stat green"><b>${all.length}</b><label>Total code companies</label></div></div><div class="file-grid"><section class="panel"><div class="panel-heading"><b>Companies inside this file</b><span class="subcaption">In source order</span></div><div class="company-list">${items}</div></section><section class="panel"><div class="code-header"><span class="file-name">${icon('code')} ${safe(f.name)}</span><span class="line-mark">Complete Java file</span></div><div class="code-body">${snippets}</div><div class="file-info">Verified line numbers from Shopizer.</div></section></div>`;
}
function tokenize(source){const re=/(\/\/[^\n]*|"(?:\\.|[^"\\])*"|@[A-Za-z_][\w]*|\b(?:public|private|protected|return|throw|new|if|for|interface|extends|void|class|final|static|default)\b|\b[A-Za-z_][\w]*(?=\s*\()|\b(?:Order|Customer|PaymentReceipt|CheckoutRequest|ResponseEntity|BigDecimal|Stock|List|CartItem|Long|JpaRepository|Optional|String|PaymentResponse|UUID|IllegalArgumentException|IllegalStateException)\b)/g;let result='',last=0;for(const m of source.matchAll(re)){result+=safe(source.slice(last,m.index));const tok=m[0];const kind=tok.startsWith('//')?'comment':tok.startsWith('"')?'string':tok.startsWith('@')||/^(public|private|protected|return|throw|new|if|for|interface|extends|void|class|final|static|default)$/.test(tok)?'keyword':source.slice(m.index+tok.length).match(/^\s*\(/)?'call':'type';result+=`<span class="tok-${kind}">${safe(tok)}</span>`;last=m.index+tok.length;}return result+safe(source.slice(last));}
function renderCodeRows(lines,start,highlights){return (lines||[]).map((s,i)=>{const line=start+i;return `<div class="code-row ${highlights.includes(line)||activeLine===line?'highlight':''}" data-line="${line}"><span class="ln">${line}</span><span class="src">${tokenize(s)}</span></div>`;}).join('');}
function getParentChain(id){const ret=[];let c=entities[id];while(c){ret.unshift(c);c=c.parent?entities[c.parent]:null;}return ret;}
function getRelations(id){const c=entities[id],needs=getNeeds(id).filter(x=>entities[x.to]);const usedBy=clientsOf(id).filter(x=>entities[x.id]);return {needs,usedBy};}
function edgeCard(id,linkLine,side,index){const c=entities[id];return `<button class="relation-card" data-company="${id}" data-highlight="${linkLine??''}" data-side="${side}" data-index="${index}" title="Open Company ${safe(c.no)} in ${safe(files[c.file].name)}"><span class="rel-num">COMPANY ${safe(c.no)} <span class="rel-arrow">↗</span></span><span class="rel-name">${safe(c.name)}</span><span class="rel-file">${safe(files[c.file].name)}</span>${linkLine!=null?`<span class="rel-line">Connected at line ${linkLine}</span>`:''}</button>`;}
function renderCompanyView(){const c=entities[selected],f=files[c.file],chain=getParentChain(selected),code=getCode(selected),links=getRelations(selected);const type=c.parent?'SUBSIDIARY COMPANY':'MAIN COMPANY';
 const header=`<div class="hero"><div><div class="eyebrow">${icon(c.parent?'branch':'building')} ${type}</div><h1>Company ${safe(c.no)} <span style="color:var(--dim)">·</span> ${safe(c.name)}</h1><p class="description">${safe(c.desc)}</p><div class="small-meta"><span class="meta-chip"><b>${safe(f.name)}</b></span><span class="meta-chip accent">Lines ${c.start}–${c.end||c.start+(c.code?.length||1)-1}</span><span class="linepath">${safe(f.path)}</span></div></div><div class="hero-actions"><button class="plain-button" data-gofile="${c.file}" title="View every company in this file">${icon('layers')} All companies</button></div></div>`;
 const strip=`<div class="path-strip"><button data-gofile="${c.file}">${safe(f.name)}</button>${chain.map((ent,i)=>`${icon('chevron')}${i===chain.length-1?`<b>Company ${safe(ent.no)}</b>`:`<button data-company="${Object.keys(entities).find(k=>entities[k]===ent)}">Company ${safe(ent.no)}</button>`}`).join('')}</div>`;
 const summary=`<div class="company-summary"><div><small>${safe(type)}</small><h2>${safe(c.name)}</h2><p>${safe(c.desc)}</p></div><div class="summary-num">${safe(c.no)}</div></div>`;
 const used=links.usedBy.map((e,i)=>edgeCard(e.id,e.line,'usedby',i)).join('')||'<div class="empty-rel">No direct company caller is mapped yet.</div>';
 const needs=links.needs.map((e,i)=>edgeCard(e.to,e.line,'uses',i)).join('')||'<div class="empty-rel">No outside service is required here.</div>';
 const focus=`<div class="focus-card" id="focus-card"><div class="focus-title"><div class="focus-overline">COMPANY ${safe(c.no)} · ${c.parent?'CODE SECTION':'JAVA METHOD'}</div><h3>${safe(c.name)}</h3><p>${safe(c.desc)}</p><div class="loc">${safe(f.name)} : ${c.start}–${c.end||c.start+(c.code?.length||1)-1}</div></div><div class="code-header"><span class="file-name">${icon('code')} ${safe(f.name)}</span><span class="line-mark">JAVA</span></div><div class="code-body graph-code" id="current-code">${renderCodeRows(code.lines,code.start,code.highlight)}</div><div class="focus-footer"><span>${c.parent?'Highlighted lines belong to its parent method':c.note||'Source code · line numbers'}</span><button class="line-button" id="copy-method" title="Copy this code">Copy code ${icon('copy')}</button></div></div>`;
 const network=`<div class="network-head"><h2>Company connections</h2><div class="labels"><span><i class="key" style="background:var(--blue)"></i>Used by</span><span><i class="key" style="background:var(--green)"></i>Selected</span><span><i class="key" style="background:var(--orange)"></i>Needs</span></div></div><section class="network" id="network"><svg class="wires" id="wires" aria-hidden="true"></svg><div class="network-layout"><div class="graph-col usedby"><div class="graph-title"><span><span class="label-square"></span>Who uses this?</span><strong>${links.usedBy.length}</strong></div><div class="nodes" id="used-nodes">${used}</div></div><div class="graph-col current"><div class="graph-title"><span><span class="label-square"></span>This company</span><strong>${safe(c.no)}</strong></div>${focus}</div><div class="graph-col uses"><div class="graph-title"><span><span class="label-square"></span>What it needs</span><strong>${links.needs.length}</strong></div><div class="nodes" id="needs-nodes">${needs}</div></div></div></section>`;
 const keyInfo=activeLine!=null?findLineInfo(selected,activeLine):null;
 const detailed=`<section class="detail-strip" id="detail-strip"><div><div class="detail-title" id="detail-title">${keyInfo?safe(keyInfo.head):'What this code does'}</div><div class="detail-note" id="detail-note">${keyInfo?safe(keyInfo.description):safe(c.desc)}</div></div><div class="detail-line" id="detail-line">${activeLine!=null?'Line '+activeLine:''}</div></section>`;
 const children=(c.children||[]).map(id=>{const sub=entities[id];return `<button class="subs-card" data-company="${id}"><span class="subs-num">COMPANY ${safe(sub.no)}</span><b>${safe(sub.name)}</b><small>${safe(sub.desc)}</small></button>`;}).join('');
 const subs=children?`<div class="section-head"><h2>Subsidiary companies</h2><span>${c.children.length} code sections inside ${safe(c.name)}</span></div><div class="subs-grid">${children}</div>`:'';
 const parent=c.parent?`<div class="section-head"><h2>Parent company</h2></div><button class="folder-card" data-company="${c.parent}">${icon('building')}<span><strong>Company ${safe(entities[c.parent].no)} · ${safe(entities[c.parent].name)}</strong><small>${safe(entities[c.parent].desc)}</small></span>${icon('chevron')}</button>`:'';
 return header+strip+summary+network+detailed+parent+subs;
}
function findLineInfo(id,line){const c=entities[id],root=topEntity(id);for(const [eid,ent] of Object.entries(entities)){if(ent.parent&&topEntity(eid)===root&&line>=ent.start&&line<=ent.end)return {head:`Company ${ent.no} · ${ent.name}`,description:ent.desc};}const req=(root.needs||[]).find(dep=>dep.line===line);if(req&&entities[req.to])return {head:`Uses ${entities[req.to].name}`,description:entities[req.to].desc};return {head:`${files[c.file].name} · line ${line}`,description:c.desc};}
function renderFolderView(){const node=collectFolder(folderData,'shopizer',folderPath);const children=node?.children||[];return `<div class="hero"><div><div class="eyebrow">${icon('folder')} REPOSITORY FOLDER</div><h1>${safe(node?.name||'Repository')}</h1><p class="description">${safe(folderPath)}</p></div></div><div class="section-head"><h2>Inside this folder</h2><span>${children.length} items</span></div>${children.map(ch=>ch.file?`<button class="folder-card" data-gofile="${ch.file}">${icon('file')}<span><strong>${safe(files[ch.file].name)}</strong><small>${safe(files[ch.file].about)}</small></span>${icon('chevron')}</button>`:ch.isResource?`<div class="folder-card" style="opacity:.55">${icon('file')}<span><strong>${safe(ch.name)}</strong><small>Configuration file</small></span></div>`:`<button class="folder-card" data-openfolder="${safe(folderPath+'/'+ch.name)}">${icon('folder')}<span><strong>${safe(ch.name)}/</strong><small>${ch.children?.length||0} items</small></span>${icon('chevron')}</button>`).join('')}`;}
function renderAll(){renderBreadcrumb();renderTree();$('#maincontent').innerHTML=mode==='company'?renderCompanyView():mode==='file'?renderFileView():renderFolderView();if(mode==='company'){requestAnimationFrame(()=>{drawWires();if(activeLine!=null)selectLine(activeLine,false);});}updateCompanySequence();}
function drawWires(){if(mode!=='company')return;const net=$('#network'),svg=$('#wires'),center=$('#focus-card');if(!net||!svg||!center)return;const B=net.getBoundingClientRect(),C=center.getBoundingClientRect();if(window.matchMedia('(max-width:1040px)').matches){svg.innerHTML='';return;}svg.setAttribute('viewBox',`0 0 ${B.width} ${B.height}`);let paths='';for(const side of ['usedby','uses']){const cards=$$('.graph-col.'+side+' .relation-card');const total=cards.length;cards.forEach((el,i)=>{const A=el.getBoundingClientRect(),left=side==='usedby',dir=left?1:-1;const x1=(left?A.right:A.left)-B.left,y1=A.top+A.height/2-B.top,x2=(left?C.left:C.right)-B.left,y2=C.top+Math.max(38,Math.min(C.height-30,100+(i-(total-1)/2)*25))-B.top;const stroke=left?'#53aaff':'#ffa445';paths+=`<path d="M${x1},${y1} C${x1+dir*32},${y1} ${x2-dir*28},${y2} ${x2},${y2}" stroke="${stroke}" stroke-width="2" fill="none" opacity=".84"/><circle cx="${x2}" cy="${y2}" r="3.6" fill="${stroke}"/><circle cx="${x1}" cy="${y1}" r="2.5" fill="${stroke}"/>`;});}svg.innerHTML=paths;}
function $$(selector){return Array.from(document.querySelectorAll(selector));}
function selectLine(line,scroll=true){if(mode!=='company')return;activeLine=line;$$('#current-code .code-row').forEach(el=>el.classList.toggle('highlight',Number(el.dataset.line)===line||(entities[selected].parent&&Number(el.dataset.line)>=entities[selected].start&&Number(el.dataset.line)<=entities[selected].end)));const info=findLineInfo(selected,line);if($('#detail-title')){$('#detail-title').textContent=info.head;$('#detail-note').textContent=info.description;$('#detail-line').textContent='Line '+line;}if(scroll){const row=$(`#current-code .code-row[data-line="${line}"]`);row?.scrollIntoView({block:'nearest',behavior:'smooth'});}}

function orderedCompanies(){
  const compare=(a,b)=>{
    const aa=entities[a].no.split('.').map(Number), bb=entities[b].no.split('.').map(Number);
    for(let i=0;i<Math.max(aa.length,bb.length);i++){
      if(i===aa.length)return -1;
      if(i===bb.length)return 1;
      if(aa[i]!==bb[i])return aa[i]-bb[i];
    }
    return 0;
  };
  return Object.keys(entities).sort(compare);
}
function companyNumberQuery(q){
  const match=String(q).trim().match(/^(?:company\s*#?\s*)?(\d+(?:\.\d+)*)$/i);
  return match ? match[1].split('.').map(Number).join('.') : null;
}
function companyByNumber(q){
  const num=companyNumberQuery(q);
  return num===null?null:orderedCompanies().find(id=>entities[id].no.split('.').map(Number).join('.')===num)||null;
}
function companySequence(){
  const selectedNo=mode==='company'&&entities[selected]?entities[selected].no:null;
  // Top-level companies navigate 1 → 2 → 3; subsidiaries navigate siblings, e.g. 2.1 → 2.2.
  if(!selectedNo||!selectedNo.includes('.'))return orderedCompanies().filter(id=>!entities[id].no.includes('.'));
  const bits=selectedNo.split('.'),parent=bits.slice(0,-1).join('.')+'.';
  return orderedCompanies().filter(id=>{
    const n=entities[id].no;return n.startsWith(parent)&&n.split('.').length===bits.length;
  });
}
function updateCompanySequence(){
  const items=companySequence(),index=mode==='company'?items.indexOf(selected):-1;
  const prev=$('#prev-company'),next=$('#next-company'),position=$('#sequence-position');
  prev.disabled=index<=0&&index!==-1 || !items.length;
  next.disabled=index>=items.length-1&&index!==-1 || !items.length;
  if(index===-1){prev.disabled=next.disabled=!items.length;position.textContent=items.length+' companies mapped';return;}
  prev.disabled=index===0;
  next.disabled=index===items.length-1;
  position.textContent='Company '+entities[selected].no+' · '+(index+1)+' / '+items.length;
  prev.title=index>0?'Company '+entities[items[index-1]].no+' · Left arrow':'First company';
  next.title=index<items.length-1?'Company '+entities[items[index+1]].no+' · Right arrow':'Last mapped company';
}
function moveCompany(direction){
  const items=companySequence();
  if(!items.length)return;
  const index=mode==='company'?items.indexOf(selected):-1;
  const nextIndex=index<0?(direction>0?0:items.length-1):index+direction;
  if(nextIndex<0||nextIndex>=items.length)return;
  navToCompany(items[nextIndex]);
}

function searchResults(q){
  const r=$('#search-results'),value=String(q).trim();
  if(!value){r.hidden=true;r.innerHTML='';return;}
  const numeric=companyNumberQuery(value);
  if(numeric!==null){
    const id=companyByNumber(value);
    r.innerHTML=id
      ?`<button data-company="${id}">${icon('building')}<span><b>Company ${safe(entities[id].no)} · ${safe(entities[id].name)}</b><small>${safe(files[entities[id].file].name)}</small></span></button>`
      :`<div class="search-unmapped">Company ${safe(numeric)} has not been created yet. Only verified companies are available.</div>`;
    r.hidden=false;return;
  }
  const needle=value.toLowerCase(),hits=[];
  for(const id of orderedCompanies()){
    const c=entities[id],file=files[c.file];
    if((c.no+' '+c.name+' '+c.method+' '+c.desc+' '+file.name+' '+file.path).toLowerCase().includes(needle)){
      hits.push({type:'company',id,label:'Company '+c.no+' · '+c.name,sub:c.method+' · '+file.name});
    }
  }
  for(const [id,f] of Object.entries(files)){
    if((f.name+' '+f.path+' '+f.about).toLowerCase().includes(needle))hits.push({type:'file',id,label:f.name,sub:f.path});
  }
  r.innerHTML=hits.slice(0,18).map(it=>`<button data-${it.type==='file'?'gofile':'company'}="${it.id}">${icon(it.type==='file'?'file':'building')}<span><b>${safe(it.label)}</b><small>${safe(it.sub)}</small></span></button>`).join('')||'<div class="search-unmapped">No matching company or file yet.</div>';
  r.hidden=false;
}
function getLocation(){if(mode==='company'){const c=entities[selected];return `${files[c.file].path}:${c.start}-${c.end||c.start+(c.code?.length||1)-1} (Company ${c.no})`;}return mode==='file'?files[selectedFile].path:folderPath;}
async function copyText(text,button){try{await navigator.clipboard.writeText(text);flash(button,'Copied');}catch(e){const box=document.createElement('textarea');box.value=text;box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.select();try{document.execCommand('copy');flash(button,'Copied');}catch(err){flash(button,'Copy unavailable');}box.remove();}}
function flash(el,txt){const previous=el.dataset.original||el.innerHTML;if(!el.dataset.original)el.dataset.original=previous;el.textContent=txt;setTimeout(()=>{if(el.isConnected)el.innerHTML=previous;},1200);}
document.addEventListener('click',e=>{const folder=e.target.closest('[data-folder]');if(folder){const key=folder.dataset.folder;if(expanded.has(key))expanded.delete(key);else expanded.add(key);renderTree();return;}const file=e.target.closest('[data-file]');if(file){const id=file.dataset.file,key='file:'+id;if(e.target.closest('.tree-chevron')){if(expanded.has(key))expanded.delete(key);else expanded.add(key);renderTree();}else{expanded.add(key);navToFile(id);}return;}const comp=e.target.closest('[data-company]');if(comp){const id=comp.dataset.company;if(comp.classList.contains('tree-row')&&e.target.closest('.tree-chevron')&&entities[id]?.children?.length){const key='co:'+id;if(expanded.has(key))expanded.delete(key);else expanded.add(key);renderTree();return;}const wantLine=comp.dataset.highlight;if(!entities[id])return;navToCompany(id);if(wantLine){ // Where possible, focus the related statement inside the destination.
 const c=entities[id];const l=Number(wantLine);if(l>=c.start&&l<=c.start+(c.code?.length||0)-1)selectLine(l);
 }$('#search-results').hidden=true;return;}const go=e.target.closest('[data-gofile]');if(go){navToFile(go.dataset.gofile);return;}const fo=e.target.closest('[data-openfolder]');if(fo){navToFolder(fo.dataset.openfolder);return;}const line=e.target.closest('#maincontent .code-row[data-line]');if(line){selectLine(Number(line.dataset.line));return;}if(!e.target.closest('.searchwrap'))$('#search-results').hidden=true;});
$('#search').addEventListener('input',e=>searchResults(e.target.value));
$('#search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const typed=e.currentTarget.value;
    const exact=companyByNumber(typed);
    if(exact){navToCompany(exact);e.currentTarget.blur();}
    else if(companyNumberQuery(typed)!==null){searchResults(typed);}
    else {const first=$('#search-results button');if(first){first.click();e.currentTarget.blur();}}
  }else if(e.key==='Escape'){$('#search-results').hidden=true;}
});
$('#prev-company').addEventListener('click',()=>moveCompany(-1));
$('#next-company').addEventListener('click',()=>moveCompany(1));
$('#copy').addEventListener('click',e=>copyText(getLocation(),e.currentTarget));
$('#maincontent').addEventListener('click',e=>{const btn=e.target.closest('#copy-method');if(btn){const c=getCode(selected);copyText(c.lines.join('\n'),btn);}});
$('#side-close').addEventListener('click',closeSidebar);
$('#menu').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#backdrop').classList.toggle('open',open);$('#menu').setAttribute('aria-expanded',String(open));});$('#backdrop').addEventListener('click',closeSidebar);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#sidebar').classList.contains('open'))closeSidebar();else if(document.activeElement?.tagName!=='INPUT')navBack();return;}
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  if(e.target?.closest?.('input,textarea,select,[contenteditable="true"]'))return;
  e.preventDefault();
  moveCompany(e.key==='ArrowRight'?1:-1);
});
window.addEventListener('resize',()=>requestAnimationFrame(drawWires));window.addEventListener('load',drawWires);

function getRelations(id){
  const c=entities[id];
  const needs=(c.needs||[]).filter(x=>entities[x.to]),usedBy=clientsOf(id).filter(x=>entities[x.id]);
  (c.externalClients||[]).forEach((x,i)=>usedBy.push({id:'outside-in-'+i,line:x.code_line??c.start}));
  (c.externalSuppliers||[]).forEach((x,i)=>needs.push({to:'outside-out-'+i,line:x.code_line??c.start}));
  return {needs,usedBy};
}
function edgeCard(id,line,side,index){
  if(String(id).startsWith('outside-')){
    const data=(side==='usedby'?entities[selected].externalClients:entities[selected].externalSuppliers)[index];
    return `<button class="relation-card" data-external="${side}" data-external-index="${index}" data-line="${data.code_line??entities[selected].start}">
    <span class="rel-num">${side==='usedby'?'WHO STARTS IT':'OUTSIDE SERVICE'} <span class="rel-arrow">↗</span></span>
    <span class="rel-name">${safe(data.name)}</span>
    <span class="rel-file">${safe(data.description||'Outside this Java file')}</span>
    <span class="rel-line">Code line ${data.code_line??entities[selected].start}</span></button>`;
  }
  const c=entities[id];
  return `<button class="relation-card" data-company="${id}" data-highlight="${line??''}" data-side="${side}" data-index="${index}">
  <span class="rel-num">COMPANY ${safe(c.no)} <span class="rel-arrow">↗</span></span>
  <span class="rel-name">${safe(c.name)}</span><span class="rel-file">${safe(files[c.file].name)}</span>
  ${line!=null?`<span class="rel-line">Connected at line ${line}</span>`:''}</button>`;
}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-external]');if(!el)return;
  e.stopImmediatePropagation();
  const c=entities[selected],items=el.dataset.external==='usedby'?c.externalClients:c.externalSuppliers,data=items[Number(el.dataset.externalIndex)];
  if(!data)return;
  selectLine(Number(el.dataset.line),true);
  const title=document.querySelector('#detail-title'),note=document.querySelector('#detail-note');
  if(title)title.textContent=data.name;if(note)note.textContent=data.description||c.desc;
},true);
// Add static SVG icons in the initial HTML shell.
$$('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
$('#maincontent').innerHTML='<div class="panel" style="padding:24px;color:var(--dim)">Loading real Shopizer code…</div>';
loadRealCode().catch(error=>{console.error(error);$('#maincontent').innerHTML='<div class="panel" style="padding:24px;color:var(--orange)">Could not load source: '+safe(error.message)+'</div>';});
</script>
