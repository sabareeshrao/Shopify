<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Company — Browser Regression Audit</title>
<style>
:root{color-scheme:dark;--white:#fff;--blue:#53aaff;--orange:#ffa445;--green:#39db8b}
*{box-sizing:border-box}body{margin:0;padding:22px;font:14px/1.55 system-ui,Arial,sans-serif;color:var(--white);background:#050505}
main{max-width:900px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{color:#ccc}button{color:#000;background:var(--green);border:2px solid #000;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#status{font-weight:800;margin:15px 0;color:var(--blue)}.panel{border:2px solid #000;background:#151515;padding:14px;border-radius:12px;margin:12px 0}
#results{white-space:pre-wrap;word-break:break-word;font:12px/1.7 ui-monospace,Consolas,monospace;max-height:280px;overflow:auto;color:var(--white)}
#preview{width:100%;max-width:425px;height:440px;border:2px solid #000;background:#050505;border-radius:11px}
small{color:#aaa}.pass{color:var(--green)}.fail{color:var(--orange)}.view{display:flex;flex-wrap:wrap;gap:12px}.view>div{flex:1;min-width:220px}
</style>
</head>
<body><main>
<h1>Code Company — Browser Regression Audit</h1>
<p>This is a separate automated QA page, not part of the main explorer. It runs against the explorer in an embedded same-origin window. No repository files are modified.</p>
<button id="run" type="button">Run complete interaction audit</button>
<div id="status" aria-live="polite">Waiting to run</div>
<div class="view"><div class="panel"><strong>Audit log</strong><pre id="results"></pre></div><div class="panel"><strong>Mobile preview</strong><p><small>Responsive embedded explorer, 425px wide.</small></p><iframe id="preview" title="Code Company Explorer mobile regression preview" loading="eager" src="../index.html?qa=mentor-blue-v1#company-6"></iframe></div></div>
</main>
<script>
'use strict';
const run=document.getElementById('run'),results=document.getElementById('results'),status=document.getElementById('status'),frame=document.getElementById('preview');
const state={companies:0,connections:0,assertions:0};
function log(text,fail=false){const node=document.createElement('div');node.textContent=(fail?'FAIL ':'PASS ')+text;node.className=fail?'fail':'pass';results.appendChild(node);if(fail)throw Error(text)}
function assert(cond,text){state.assertions++;if(!cond)log(text,true)}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function ready(){
 const started=Date.now();
 while(Date.now()-started<25000){
  const doc=frame.contentDocument;
  if(doc&&doc.querySelector('.company-summary')&&doc.querySelector('#search-results'))return doc;
  await delay(150);
 }
 throw Error('Explorer did not load within 25 seconds. Check network requests and the console.');
}
const mentorLessonsSeen=new Map();
function openCompany(doc,n){
 const search=doc.querySelector('#search');
 assert(search,'Search input missing');
 search.value=String(n);
 search.dispatchEvent(new Event('input',{bubbles:true}));
 const card=doc.querySelector('#search-results button[data-company="company-'+n+'"]');
 assert(card,'Numeric search did not offer Company '+n);
 card.click();
 const title=doc.querySelector('#maincontent .hero h1');
 assert(title?.textContent.includes('Company '+n),'Opened the wrong company: '+n);
 assert(frame.contentWindow.location.hash==='#company-'+n,'Company '+n+' URL fragment is wrong');
 assert(doc.querySelector('.learning-card.question')?.textContent.includes('IQ-'+n),'Interview question missing for Company '+n);
 assert(doc.querySelector('.learning-card.sequence')?.textContent.includes('Why Company '+n),'Sequence explanation missing for Company '+n);
  const lesson=doc.querySelector('.learning-card.sequence p')?.textContent.trim();
  assert(lesson&&lesson.length>190,'Company '+n+' mentor lesson is missing or too short');
  assert(!mentorLessonsSeen.has(lesson)||mentorLessonsSeen.get(lesson)===n,'Repeated mentor explanation at Company '+n+' (first seen at '+mentorLessonsSeen.get(lesson)+')');
  mentorLessonsSeen.set(lesson,n);
  assert(!lesson.startsWith('First, find the real application'),'Company '+n+' still uses the old technical documentation prose');
}
function checkBox(doc,box,n){
 const side=box.dataset.external,index=box.dataset.externalIndex;
 const name=box.querySelector('.rel-name')?.textContent.trim();
 const expected=Number(box.dataset.line);
 assert(name&&Number.isInteger(expected),'Company '+n+' has invalid relation metadata');
 box.click();
 const highlighted=[...doc.querySelectorAll('#current-code .code-row.highlight')].map(x=>Number(x.dataset.line));
 const active=[...doc.querySelectorAll('.relation-card.is-selected')];
 assert(active.length===1&&active[0]===box,'Company '+n+' relation '+side+'/'+index+' did not become the only selected box');
 assert(box.getAttribute('aria-pressed')==='true','Company '+n+' selected box aria-pressed is incorrect');
 const sourceContainsLine=[...doc.querySelectorAll('#current-code .code-row[data-line]')].some(row=>Number(row.dataset.line)===expected);
 if(sourceContainsLine)assert(highlighted.length===1&&highlighted[0]===expected,'Company '+n+' '+name+' should highlight line '+expected+', got '+highlighted.join(','));
 else assert(highlighted.length===0,'Company '+n+' '+name+' has an outside-method callsite, which must not highlight an unrelated line');
 assert(doc.querySelector('#detail-title')?.textContent.trim()===name,'Company '+n+' '+name+' displayed a stale explanation title');
 const detail=doc.querySelector('#detail-note')?.textContent.trim();
 assert(detail?.length>0,'Company '+n+' '+name+' explanation is empty');
 state.connections++;
}
async function audit(){
 state.companies=0;state.connections=0;state.assertions=0;results.replaceChildren();
 status.textContent='Checking 176 completed lessons and the additional indexed-company inventory…';
 const doc=await ready();
 const allRoot=doc.querySelector('.tree-row.folder .mini-count');
 assert(allRoot?.textContent.includes('1340'),'Complete pinned repository manifest must include 1,340 tracked files');
 assert(doc.querySelector('.tree-row.folder[data-folder="f:shopizer"]'),'Original repository root is absent');

 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 6'),'Deep link #company-6 did not restore Company 6 on load');
 const sidebar=doc.querySelector('.side'),mainBody=doc.body;
 assert(frame.contentWindow.getComputedStyle(sidebar).backgroundColor===frame.contentWindow.getComputedStyle(mainBody).backgroundColor,'Project sidebar must match the black main background');
 assert(frame.contentWindow.getComputedStyle(doc.querySelector('.side-body')).scrollbarWidth==='thin','Project scrollbar must be thin');
 assert(doc.querySelectorAll('[title]').length===0,'Native hover tooltip attributes must be absent from the explorer');

 // Rendering contract: original Java uses tabs. GitHub-like indentation
 // must use four-column stops in both the full-file and company code panes.
 const checkedCode=doc.querySelector('#current-code .code-row .src');
 assert(checkedCode,'Current-company code content missing');
 assert(frame.contentWindow.getComputedStyle(checkedCode).tabSize==='4','Company code indent must use four-column tabs');

 mentorLessonsSeen.clear();
 for(let n=1;n<=176;n++){
  openCompany(doc,n);
  const buttons=[...doc.querySelectorAll('.relation-card[data-external]')];
  for(const button of buttons)checkBox(doc,button,n);
  const total=doc.querySelectorAll('.relation-card.is-selected').length;
  if(buttons.length)assert(total===1,'Company '+n+' selected-card count changed unexpectedly');
  const codeLine=doc.querySelector('#current-code .code-row[data-line]');
  assert(codeLine,'Company '+n+' has no original Java code lines');
  codeLine.click();
  assert(doc.querySelectorAll('.relation-card.is-selected').length===0,'Company '+n+' did not clear the selected card when a code line was tapped');
  assert(doc.querySelectorAll('[title]').length===0,'Company '+n+' produced a hover tooltip');
  state.companies++;
  status.textContent='Checked '+n+'/176 companies, '+state.connections+' connection boxes…';
 }

 openCompany(doc,54);
 const fullSourceButton=doc.querySelector('.hero-actions [data-gofile]');
 assert(fullSourceButton,'Company 54 must offer full Java file view');
 fullSourceButton.click();
 assert(!doc.querySelector('.source-structure'),'Removed redundant source-structure panel must not be rendered');
 assert(doc.querySelector('#source-line-info'),'Source explanation must occupy the existing code footer');
 const fullFileCode=doc.querySelector('.file-grid .code-row .src');
 assert(fullFileCode&&frame.contentWindow.getComputedStyle(fullFileCode).tabSize==='4','Full Java file must use the same four-column tabs');

 assert(frame.contentWindow.getComputedStyle(doc.documentElement).getPropertyValue('--source-learning-blue').trim()==='#a9ceff','Unnumbered source highlight must be the approved light blue');
 assert(doc.querySelector('.code-header .line-mark')?.textContent.includes('blue'),'Source legend must identify blue lines');
 const sourceRows=doc.querySelectorAll('.file-grid .code-row.source-unmapped');
 assert(sourceRows.length>0,'Unnumbered nonblank source lines should be highlighted blue');
 const blueLine=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="1"]');
 assert(blueLine,'Package declaration on line 1 must be selectable as non-company source');
 blueLine.click();
 assert(blueLine.classList.contains('source-inspected'),'Selected package line should show distinct blue selection');
 assert(doc.querySelector('#source-line-info')?.textContent.includes('Package / address'),'Package info missing below code');
 assert(doc.querySelector('#source-line-info')?.textContent.includes('com.salesmanager.shop.store.security.admin'),'Package explanation not grounded in source');
 const importLine=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="6"]');
 assert(importLine,'BadCredentialsException import line must be available');
 importLine.click();
 assert(doc.querySelector('#source-line-info')?.textContent.includes('BadCredentialsException'),'Source import explanation must name the imported type');
 const importLesson=doc.querySelector('#source-line-info')?.textContent;
 const nextImport=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="7"]');
 assert(nextImport,'Next distinct imported type must be present');
 nextImport.click();
 const otherLesson=doc.querySelector('#source-line-info')?.textContent;
 assert(otherLesson?.includes('UsernamePasswordAuthenticationToken')&&importLesson!==otherLesson,'Different imports must teach different purposes');
 const commentLine=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="16"]');
 assert(commentLine,'JavaDoc comment line 16 must be clickable');
 commentLine.click();
 assert(doc.querySelector('#source-line-info')?.textContent.includes('JavaDoc'),'Comment explanation missing');
 const inheritance=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="21"]');
 assert(inheritance,'Inheritance declaration line missing');
 inheritance.click();
 assert(doc.querySelector('#source-line-info')?.textContent.includes('DaoAuthenticationProvider'),'Inheritance explanation must identify parent type');
 const injected=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="23"]');
 assert(injected,'@Autowired source line missing');
 injected.click();
 assert(doc.querySelector('#source-line-info')?.textContent.includes('asks Spring to supply'),'@Autowired mentor explanation missing');
 const field=doc.querySelector('.file-grid .code-row.source-unmapped[data-line="24"]');
 assert(field,'Dependency field line must be blue');
 field.click();
 assert(doc.querySelector('#source-line-info')?.textContent.includes('UserDetailsService'),'Field explanation should identify source field');
 assert(!doc.querySelector('[title]'),'Source explanation must not reintroduce tooltip boxes');
 assert(doc.querySelector('#maincontent')?.textContent.includes('No company number has been assigned')===false,'Mapped file should remain mapped');
 doc.querySelector('#history-back').click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 54'),'Back from full Java file must restore Company 54');

 // Selection and scroll remain synchronized for a deep company.
 // Open the mobile Project drawer before measuring visible row coordinates.
 frame.contentWindow.scrollTo(0,450);
 await delay(40);
 openCompany(doc,44);
 await delay(120);
 assert(frame.contentWindow.scrollY<4,'Opening Company 44 must show the top of its new right-hand page');
 const java326=doc.querySelector('#current-code .code-row[data-line="326"] .src')?.textContent||'';
 const java328=doc.querySelector('#current-code .code-row[data-line="328"] .src')?.textContent||'';
 assert(/^\t{3}http\s*$/.test(java326),'Security configuration line 326 must preserve its three original tabs');
 assert(/^\t{5}\.authorizeRequests\(\)/.test(java328),'Security chain line 328 must preserve five original tabs');
 assert(frame.contentWindow.getComputedStyle(doc.querySelector('#current-code .code-row[data-line="328"] .src')).tabSize==='4','Security configuration chains must match four-column GitHub-style tab alignment');

 assert(doc.querySelector('#tree .tree-row.comp.is-active[data-company="company-44"]'),'Company 44 must be selected in Project tree');
 assert(doc.querySelector('#tree [data-company="company-44"]')?.getAttribute('aria-current')==='location','Accessible active Project row must match Company 44');
 doc.querySelector('#menu').click();
 await delay(300);
 const projectViewport=doc.querySelector('.side-body').getBoundingClientRect();
 const activeNode=doc.querySelector('#tree [data-company="company-44"]').getBoundingClientRect();
 assert(activeNode.top>=projectViewport.top-2&&activeNode.bottom<=projectViewport.bottom+2,'Company 44 selected row is hidden outside the sidebar viewport');
 doc.querySelector('#side-close').click();
 frame.contentWindow.scrollTo(0,240);
 await delay(30);
 const previousReadingOffset=frame.contentWindow.scrollY;
 doc.querySelector('#next-company').click();
 await delay(100);
 assert(frame.contentWindow.scrollY<4,'Switching companies must reset right-pane scroll to the company heading');
 assert(doc.querySelector('#tree .tree-row.comp.is-active[data-company="company-45"]'),'Next company must update Project highlight to Company 45');
 assert(!doc.querySelector('#tree .tree-row.comp.is-active[data-company="company-44"]'),'Previous Project highlight must clear after navigation');
 doc.querySelector('#history-back').click();
 await delay(100);
 assert(Math.abs(frame.contentWindow.scrollY-previousReadingOffset)<8,'Back must restore the previous company reading position');
 assert(doc.querySelector('#tree .tree-row.comp.is-active[data-company="company-44"]'),'Back must restore Company 44 Project highlight');

 openCompany(doc,116);
 const before117=doc.querySelector('#maincontent .hero h1')?.textContent;
 doc.querySelector('#next-company').click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 117'),'Sequential next 116 → 117 failed');
 doc.querySelector('#history-back').click();
 assert(doc.querySelector('.hero h1')?.textContent===before117,'Back after 116 → 117 failed');
 openCompany(doc,136);
 doc.querySelector('#next-company').click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 137'),'Next 136 → 137 failed');
 assert(doc.querySelector('.learning-card.sequence')?.textContent.includes('AuthenticationRequest'),'Company 137 narration must reference original login request');
 openCompany(doc,144);
 assert(doc.querySelector('#current-code')?.textContent.includes('super.setId(userId)'),'Company 144 original response must assign inherited ID');
 openCompany(doc,147);
 assert(doc.querySelector('#current-code')?.textContent.includes('jwtCustomerAuthenticationManager.authenticate'),'Company 147 must show real manager call');
 assert(doc.querySelector('.relation-card[data-company="company-139"]'),'Company 147 must link submitted username');
 assert(doc.querySelector('.relation-card[data-company="company-75"]'),'Company 147 must link JWT generation');
 openCompany(doc,153);
 assert(doc.querySelector('#current-code')?.textContent.includes('customerFacade.changePassword'),'Company 153 must contain password change service call');
 openCompany(doc,154);
 assert(doc.querySelector('#current-code')?.textContent.includes('groupService.findByName'),'Company 154 must show group lookup');
 
 openCompany(doc,156);
 doc.querySelector('#next-company').click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 157'),'Next 156 → 157 must open the incomplete permissions facade');
 assert(doc.querySelector('#current-code')?.textContent.includes('Not implemented'),'Company 157 must visibly show the real unfinished permission lookup');
 openCompany(doc,158);
 assert(doc.querySelector('#current-code')?.textContent.includes('userPasswordPattern.matcher'),'Company 158 must show real regex validation');
 openCompany(doc,160);
 assert(doc.querySelector('#current-code')?.textContent.includes('passwordEncoder.matches(newPassword, modelPassword)'),'Company 160 must preserve raw/encoded argument order');
 openCompany(doc,162);
 assert(doc.querySelector('#current-code')?.textContent.includes('response.sendRedirect'),'Company 162 must show actual denied redirect');
 assert(doc.querySelector('.relation-card[data-company="company-163"]'),'Company 162 must link denied redirect target accessor');
 openCompany(doc,165);
 assert(doc.querySelector('#current-code')?.textContent.includes('SPRING_SECURITY_CONTEXT'),'Company 165 must show security session update');
 assert(doc.querySelector('.relation-card[data-company="company-168"]'),'Company 165 must link the concrete successful-login redirect');
 openCompany(doc,168);
 assert(doc.querySelector('#current-code')?.textContent.includes('/admin/home.html'),'Company 168 must show actual admin home path');
 openCompany(doc,169);
 assert(doc.querySelector('#current-code')?.textContent.includes('new SecurityDataAccessException'),'Company 169 must show wrapped user lookup exception');
 assert(doc.querySelector('.relation-card[data-company="company-172"]'),'Company 169 must link cause-preserving exception constructor');
 openCompany(doc,170);
 assert(doc.querySelector('#current-code')?.textContent.includes('DEFAULT_INITIAL_PASSWORD'),'Company 170 must surface original bootstrap password constant usage');
 openCompany(doc,173);
 assert(doc.querySelector('#current-code')?.textContent.includes('return null'),'Company 173 must transparently show the unfinished permission converter');
 openCompany(doc,174);
 assert(doc.querySelector('#current-code')?.textContent.includes('return null'),'Company 174 must transparently show the unfinished permission DTO factory');
 openCompany(doc,176);
 assert(doc.querySelector('#current-code')?.textContent.includes('this.setUsername(username)'),'Company 176 must show reset DTO initialization');

 assert(!doc.querySelector('#next-company')?.disabled,'Next must continue past 176 into pending Company 177');
 doc.querySelector('#next-company').click();
 assert(doc.querySelector('#maincontent .hero h1')?.textContent.includes('Company 177'),'Sequential 176 → 177 must open first inventory-only company');
 assert(doc.querySelector('.learning-card.sequence')?.textContent.includes('YouTube-style explanation pending'),'Company 177 must NOT invent a mentor narrative');
 assert(doc.querySelector('.learning-card.question')?.textContent.includes('NOT WRITTEN'),'Company 177 must NOT invent an interview question');
 assert(doc.querySelector('.repo-meta')?.textContent.includes('7720')||doc.querySelector('.repo-meta')?.textContent.includes('7,720'),'Sidebar must show all 7,720 indexed companies');
 const pendingSearch=doc.querySelector('#search');
 pendingSearch.value='7720';
 pendingSearch.dispatchEvent(new Event('input',{bubbles:true}));
 const lastPending=doc.querySelector('#search-results button[data-company="company-7720"]');
 assert(lastPending,'Company 7720 must be searchable by its real numeric ID');
 lastPending.click();
 assert(doc.querySelector('#maincontent .hero h1')?.textContent.includes('Company 7720'),'Last numbered inventory company must be navigable');
 assert(doc.querySelector('#next-company')?.disabled,'Company 7720 must be the final indexed company');

 openCompany(doc,128);
 assert(doc.querySelector('.relation-card[data-company="company-98"]'),'Company 128 missing Company 98 client link');
 openCompany(doc,130);
 assert(doc.querySelector('.relation-card[data-company="company-98"]'),'Company 130 missing Company 98 client link');
 openCompany(doc,6);
 const originalCompany=doc.querySelector('#maincontent .hero h1')?.textContent;
 const graphNode=doc.querySelector('.relation-card[data-company="company-8"]');
 assert(graphNode,'Company 6 → 8 node missing');
 assert(graphNode.tagName==='A','Internal node must be a real browser link');
 assert(graphNode.target==='_blank','Company node must open a separate tab');
 assert(graphNode.rel.includes('noopener'),'Company node requires safe new-tab behavior');
 assert(graphNode.href.includes('#company-8'),'Company link must target Company 8');
 assert(doc.querySelector('#maincontent .hero h1')?.textContent===originalCompany,'Opening a node must not replace the current company');
 assert(frame.contentWindow.location.hash==='#company-6','Graph node changed the original tab URL');
 assert(doc.querySelector('#history-back'),'Sticky Back button missing');
 doc.querySelector('#next-company').click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 7'),'Next button should navigate 6 → 7');
 assert(!doc.querySelector('#history-back').disabled,'Back must be enabled after navigating');
 doc.querySelector('#history-back').click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 6'),'Back should restore Company 6');
 assert(frame.contentWindow.location.hash==='#company-6','Back should restore the URL hash');
 openCompany(doc,7);
 const all=doc.querySelector('#maincontent button[data-gofile]');
 assert(all,'File-navigation button missing');
 all.click();
 assert(!frame.contentWindow.location.hash,'File view should clear the company URL hash');
 const coverage=doc.querySelector('.code-divider')?.textContent||'';
 assert(coverage.includes('review candidates'),'File view must display real source review candidates');
 assert(doc.querySelector('.file-grid .code-row.source-unmapped'),'Unnumbered Java source must be visually marked');
 const mapped=doc.querySelector('.file-grid .code-row[data-line="105"][data-source-company]');
 assert(mapped,'Company 7 line 105 missing from the full source');
 mapped.click();
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 7'),'Clicking mapped line should open Company 7');
 assert(Number(doc.querySelector('#current-code .code-row.highlight')?.dataset.line)===105,'Mapped source line changed');
 const gutter=doc.querySelector('#current-code .code-row .ln');
 assert(frame.contentWindow.getComputedStyle(gutter)?.position==='sticky','Code gutter should be sticky');
 assert(!doc.querySelector('#tree-pan-left')&&!doc.querySelector('#tree-pan-right'),'Old horizontal pan controls must be removed');
 assert(doc.querySelector('.ide-project-title')?.textContent.includes('Project'),'Compact Project header missing');
 assert(doc.querySelector('#project-locate')&&doc.querySelector('#project-collapse')&&doc.querySelector('#project-expand')&&doc.querySelector('#project-reset-width'),'Functional toolbar controls missing');
 assert(doc.querySelector('.tree-canvas .ide-node-icon'),'Folder and Java vector icons missing');
 const resizer=doc.getElementById('sidebar-resizer');
 assert(resizer&&resizer.getAttribute('role')==='separator','Accessible IDE sidebar resize separator missing');
 assert(frame.contentWindow.getComputedStyle(resizer).display==='none','Resizable separator should be hidden in mobile drawer');
 const prevWidth=frame.style.width,prevMax=frame.style.maxWidth;
 frame.style.maxWidth='none';frame.style.width='1300px';
 await delay(150);
 assert(frame.contentWindow.getComputedStyle(resizer).display!=='none','Desktop IDE resize separator did not appear');
 const rootStyle=frame.contentDocument.documentElement.style;
 const oldPanel=parseInt(rootStyle.getPropertyValue('--sidebar-width'),10);
 resizer.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));
 const wider=parseInt(rootStyle.getPropertyValue('--sidebar-width'),10);
 assert(wider>oldPanel,'ArrowRight must widen the sidebar, not navigate companies');
 assert(doc.querySelector('.hero h1')?.textContent.includes('Company 7'),'Resizing must not change the selected company');
 resizer.dispatchEvent(new frame.contentWindow.MouseEvent('dblclick',{bubbles:true}));
 assert(parseInt(rootStyle.getPropertyValue('--sidebar-width'),10)===296,'Double-click should reset sidebar to compact 296px');
 frame.style.width=prevWidth;frame.style.maxWidth=prevMax;await delay(150);
 assert(frame.contentWindow.getComputedStyle(doc.querySelector('#wires'))?.display==='none','Mobile cables should be hidden in stacked layout');
 log('All 176 curated lessons plus source-indexed Companies 177–7720, '+state.connections+' connection boxes and '+state.assertions+' assertions passed');
 status.className='pass';status.textContent='PASS — '+state.companies+' companies · '+state.connections+' selected boxes · '+state.assertions+' assertions';
}
run.addEventListener('click',async()=>{
 run.disabled=true;status.className='';try{await audit()}catch(e){status.className='fail';status.textContent='FAILED — '+e.message;console.error(e)}finally{run.disabled=false}
});
</script>
</body></html>
